services:
  # Full-Stack Web Service on Render (Free Tier Compatible)
  # Builds React frontend and serves both API and Web UI via FastAPI
  - type: web
    name: health-copilot-ai
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PORT
        value: 10000
